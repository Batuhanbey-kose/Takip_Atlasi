<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Takip Atlasi</title>
  <desc id="desc">Animated compass and relationship map for the Android application</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17142d"/>
      <stop offset=".52" stop-color="#2a2548"/>
      <stop offset="1" stop-color="#17142d"/>
    </linearGradient>
    <linearGradient id="accent" x1="430" y1="70" x2="790" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a997ff"/>
      <stop offset=".5" stop-color="#4dceca"/>
      <stop offset="1" stop-color="#c7eb55"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7357f6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7357f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05040d" flood-opacity=".46"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#background)"/>
  <rect width="1200" height="420" rx="34" fill="url(#grid)"/>
  <circle cx="620" cy="210" r="300" fill="url(#glow)">
    <animate attributeName="r" values="270;320;270" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;1;.65" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(185 210)" filter="url(#shadow)">
    <circle r="104" fill="#201b3c" stroke="#7357f6" stroke-width="14"/>
    <circle r="75" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3" stroke-dasharray="7 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="4s" repeatCount="indefinite"/>
      <path d="M25-66 9-5-27 69-10 7Z" fill="url(#accent)" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <circle cx="73" cy="-69" r="18" fill="#ff6f61" stroke="#fffdf8" stroke-width="6">
      <animate attributeName="r" values="16;20;16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-72" cy="72" r="13" fill="#4dceca" stroke="#fffdf8" stroke-width="5"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="2">
    <ellipse cx="865" cy="210" rx="236" ry="132" stroke-dasharray="11 18">
      <animateTransform attributeName="transform" type="rotate" from="0 865 210" to="360 865 210" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="865" cy="210" rx="176" ry="92" stroke-dasharray="5 14">
      <animateTransform attributeName="transform" type="rotate" from="360 865 210" to="0 865 210" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(744 92)">
      <rect width="178" height="72" rx="19" fill="#fffdf8"/>
      <circle cx="37" cy="36" r="18" fill="#7357f6"/>
      <rect x="69" y="22" width="78" height="9" rx="4.5" fill="#17142d" fill-opacity=".82"/>
      <rect x="69" y="41" width="53" height="7" rx="3.5" fill="#7357f6" fill-opacity=".36"/>
      <animateTransform attributeName="transform" type="translate" values="744 92;744 82;744 92" dur="4.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(906 244)">
      <rect width="194" height="78" rx="20" fill="#fffdf8"/>
      <circle cx="40" cy="39" r="19" fill="#ff6f61"/>
      <rect x="75" y="23" width="84" height="9" rx="4.5" fill="#17142d" fill-opacity=".82"/>
      <rect x="75" y="43" width="64" height="7" rx="3.5" fill="#ff6f61" fill-opacity=".34"/>
      <animateTransform attributeName="transform" type="translate" values="906 244;906 256;906 244" dur="5.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(680 279)">
      <rect width="166" height="68" rx="18" fill="#fffdf8"/>
      <circle cx="34" cy="34" r="16" fill="#4dceca"/>
      <rect x="64" y="20" width="72" height="8" rx="4" fill="#17142d" fill-opacity=".82"/>
      <rect x="64" y="38" width="46" height="7" rx="3.5" fill="#4dceca" fill-opacity=".36"/>
      <animateTransform attributeName="transform" type="translate" values="680 279;680 271;680 279" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <circle r="8" fill="#c7eb55">
    <animateMotion path="M650 210C735 70 1000 62 1084 194C1002 338 748 350 650 210Z" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#ff6f61">
    <animateMotion path="M650 210C760 330 1034 346 1092 206C1020 74 760 80 650 210Z" dur="11s" begin="-4s" repeatCount="indefinite"/>
  </circle>

  <text x="360" y="174" fill="#c7eb55" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">ANDROID'DE YEREL ANALIZ</text>
  <text x="360" y="228" fill="#fffdf8" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2">Takip Atlasi</text>
  <text x="362" y="266" fill="#fffdf8" fill-opacity=".58" font-family="Segoe UI, Arial, sans-serif" font-size="19">Takip cevrendeki degisimi tek bakista gor.</text>
  <g transform="translate(362 292)">
    <rect width="204" height="42" rx="21" fill="#7357f6"/>
    <circle cx="22" cy="21" r="5" fill="#c7eb55">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="27" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Veri telefonda kalir</text>
  </g>
</svg>
